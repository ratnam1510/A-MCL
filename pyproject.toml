[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amcl-server"
version = "1.3.2"
description = "A/MCL — Agent/Multi-Coding-agent Context Layer. MCP server for automatic context persistence across AI coding agents."
readme = "README.md"
authors = [
    { name = "Ratnam Shah", email = "110657687+ratnam1510@users.noreply.github.com" }
]
keywords = ["mcp", "ai", "agents", "context", "llm", "coding"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "watchdog>=4.0.0",
    "gitpython>=3.1.0",
    "click>=8.1.0",
    "psutil>=5.9.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
accurate-tokens = ["tiktoken>=0.5.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E702"]

[project.urls]
Homepage = "https://github.com/ratnam1510/A-MCL"
Repository = "https://github.com/ratnam1510/A-MCL.git"
Issues = "https://github.com/ratnam1510/A-MCL/issues"

[project.scripts]
amcl = "amcl.cli:main"
amcl-server = "amcl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
